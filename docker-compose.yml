services:
  gofer-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gofer-bot
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - HTTP_PROXY=http://127.0.0.1:8080
      - HTTPS_PROXY=http://127.0.0.1:8080
    restart: unless-stopped
